    <!--
    The full-viewport cloud texture is the largest paint on narrow screens, and
    a CSS background is only discovered once the stylesheet parses. Browsers
    without AVIF skip this on the type hint and take the PNG from the stylesheet.
  -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="images/background/cloud3.avif"
      fetchpriority="high"
    />
  </head>

  <body>
    <!-- Match Safari status bar / toolbar tint to the page background before first paint. -->
    <script>
      (function () {
        try {
          document.documentElement.style.colorScheme = 'light';

          var color = '#eeeeee';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var meta = metas[0];
          if (!meta) {
            meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            document.head.appendChild(meta);
          }
          meta.removeAttribute('media');
          meta.setAttribute('content', color);
          for (var i = 1; i < metas.length; i++) {
            metas[i].remove();
          }
        } catch (e) {}
      })();
    </script>

    <app-root></app-root>
  </body>
