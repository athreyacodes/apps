name: Preview

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  hosting-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Assemble Hosting
        run: npx nx run hosting:assemble

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: preview
        run: |
          npx -y firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d \
            --project apps-athreya-codes \
            --non-interactive \
            --json > /tmp/firebase-preview.json
          URL="$(node -e "const r=require('/tmp/firebase-preview.json'); process.stdout.write(r.result['apps-athreya-codes'].url)")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "${{ github.event.number }}" --body "Preview: ${PREVIEW_URL}"
